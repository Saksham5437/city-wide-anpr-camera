version: '3.8'

# Note: For standard local development with MySQL Workbench, run MySQL Server directly
# on your host machine (localhost:3306). Docker MySQL service below is optional.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Connects to your local MySQL 8.x running on the host machine
      - DATABASE_URL=mysql+pymysql://root:password@host.docker.internal:3306/city_anpr?charset=utf8mb4
      - ENVIRONMENT=production
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws/live
    depends_on:
      - backend
    restart: unless-stopped

  # Optional standalone MySQL container (disabled by default so it does not conflict with local MySQL Server on 3306)
  mysql-optional:
    image: mysql:8.0
    profiles:
      - docker-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=city_anpr
      - MYSQL_USER=anpr_user
      - MYSQL_PASSWORD=anpr_password
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysqldata:
